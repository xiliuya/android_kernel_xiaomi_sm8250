name: Anykernel3 module build
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch_choice:
        description: '快捷选择预设分支'
        required: true
        default: 'DroidSpace-fork'
        type: choice
        options:
          - DroidSpace-fork
          - lineage-23.2
          - '[使用下方自定义分支]'
      custom_branch:
        description: '手动输入分支/Tag/Commit（若填写，将优先覆盖上方下拉框）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build a Anykernel3 module zip
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branch/ref
        id: parse_ref
        run: |
          CUSTOM="${{ inputs.custom_branch }}"
          CHOICE="${{ inputs.branch_choice }}"

          if [ -n "$CUSTOM" ]; then
            TARGET="$CUSTOM"
          elif [ -n "$CHOICE" ] && [ "$CHOICE" != "[使用下方自定义分支]" ]; then
            TARGET="$CHOICE"
          else
            TARGET="${{ github.ref }}"
          fi

          echo "💡 最终确定的构建 Ref 为: $TARGET"
          echo "BUILD_REF=$TARGET" >> $GITHUB_ENV

      - name: Check out repository code
        uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 1

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: Install depend
        run: |
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi
          $SUDO apt-get update && $SUDO apt-get upgrade -y && $SUDO apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev cpio python-is-python3 libssl-dev libelf-dev flex bison bc device-tree-compiler

      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The target ref is ${{ env.BUILD_REF }} and your repository is ${{ github.repository }}."

      - name: List files in the repository
        run: |
          ls -la ${{ github.workspace }}

      - name: fetch clang
        run: bash fetch_android_clang.sh clang-r547379

      - name: Build kernel
        run: bash build.sh ${{ github.workspace }}

      - name: build Anykernel3 zip
        run: >
          bash build_ak3.sh 
          https://github.com/xiliuya/AnyKernel3.git 
          out/arch/arm64/boot/Image
          alioth_ak3.zip

      - name: fetch kptools and kpimg
        run: bash fetch_patch_tools.sh

      - name: fetch kptools and kpimg
        run: ./kptools-linux -p -i out/arch/arm64/boot/Image -k kpimg -o Image

      - name: Build APatch Anykernel3 zip
        run: >
          bash build_ak3.sh 
          https://github.com/xiliuya/AnyKernel3.git 
          Image
          alioth_apatch_ak3.zip

      - run: echo "🍏 This job's status is ${{ job.status }}."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Kernel_Build_file
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/
            build_errors.txt
            build.log
            alioth_ak3.zip
            alioth_apatch_ak3.zip
            headers.tar.gz
          retention-days: 7

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: ${{ !env.ACT && github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') }}
        with:
          files: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/
            build_errors.txt
            build.log
            alioth_ak3.zip
            alioth_apatch_ak3.zip
            headers.tar.gz
